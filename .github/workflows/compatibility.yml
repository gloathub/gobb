name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Cache Makes dependencies
      uses: actions/cache@v4
      with:
        path: .cache/
        key: compat-${{ runner.os }}-${{ hashFiles('Makefile', 'VERSION', 'compat/capabilities.edn', 'compat/fixtures.edn', 'compat/inventory.edn', 'util/capabilities', 'util/compat', 'util/inventory') }}
        restore-keys: compat-${{ runner.os }}-

    - name: Test target capability contract
      run: |
        make capabilities
        make capability-test

    - name: Generate BB surface inventory
      run: make inventory

    - name: Compare Gobb with Babashka
      run: make compat STRICT=1

    - name: Verify tracked compatibility reports
      run: |
        git diff --exit-code -- \
          compat/ledger.edn \
          src/gobb/capability_matrix.clj \
          www/docs/compatibility.md \
          www/docs/inventory.md \
          www/docs/platforms.md

    - name: Publish compatibility summary
      if: always() && hashFiles('www/docs/compatibility.md') != ''
      run: |
        cat www/docs/compatibility.md >> "$GITHUB_STEP_SUMMARY"
        printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
        cat www/docs/inventory.md >> "$GITHUB_STEP_SUMMARY"
        printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
        cat www/docs/platforms.md >> "$GITHUB_STEP_SUMMARY"

    - name: Publish compatibility diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gobb-compatibility-${{ github.run_id }}
        path: |
          .cache/compat/
          .cache/capabilities/*.edn
          compat/ledger.edn
          www/docs/compatibility.md
          www/docs/inventory.md
          www/docs/platforms.md
        if-no-files-found: warn
        retention-days: 14
